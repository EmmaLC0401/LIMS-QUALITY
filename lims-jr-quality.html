<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIMS · JR-QUALITY</title>
<style>
  :root{
    --bg: #0F1519;
    --panel: #171F25;
    --panel-alt: #1D2731;
    --panel-raised: #223039;
    --border: #2A3841;
    --border-soft: #223039;
    --text: #E7EDEF;
    --text-muted: #86979F;
    --text-dim: #566269;
    --amber: #F2B705;
    --amber-soft: rgba(242,183,5,0.14);
    --red: #E4572E;
    --red-soft: rgba(228,87,46,0.14);
    --teal: #2FB6A0;
    --teal-soft: rgba(47,182,160,0.14);
    --blue: #4C8DFF;
    --mono: ui-monospace, "SFMono-Regular", "IBM Plex Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);height:100%;}
  #root{min-height:100vh;display:flex;flex-direction:column;}
  ::selection{background:var(--amber);color:#141414;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

  /* ---------- topbar ---------- */
  .topbar{
    display:flex;align-items:center;gap:14px;
    padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:40;
  }
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--mono);}
  .brand-mark{
    width:30px;height:30px;border:1.5px solid var(--amber);border-radius:2px;
    display:flex;align-items:center;justify-content:center;color:var(--amber);
    font-weight:700;font-size:13px;flex-shrink:0;
    background:repeating-linear-gradient(45deg, transparent, transparent 3px, rgba(242,183,5,0.08) 3px, rgba(242,183,5,0.08) 6px);
  }
  .brand-text b{letter-spacing:0.14em;font-size:13px;color:var(--text);text-transform:uppercase;}
  .brand-text span{display:block;font-size:10px;color:var(--text-dim);letter-spacing:0.08em;margin-top:1px;}
  .led{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 6px var(--teal);flex-shrink:0;}
  .led.off{background:var(--red);box-shadow:0 0 6px var(--red);animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:0.35;}}
  .sync-pill{
    display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--text-muted);
    padding:6px 10px;border:1px solid var(--border);border-radius:20px;background:var(--panel-alt);cursor:pointer;
    white-space:nowrap;
  }
  .sync-pill:hover{border-color:var(--text-dim);}
  .sync-badge{background:var(--amber);color:#161616;font-weight:700;border-radius:10px;padding:0 6px;font-size:10px;}
  .topbar-spacer{flex:1;}
  .role-select{
    font-family:var(--mono);font-size:11px;background:var(--panel-alt);color:var(--text);
    border:1px solid var(--border);padding:7px 10px;border-radius:var(--radius);letter-spacing:0.03em;
  }
  .role-select:focus{outline:1px solid var(--amber);}

  /* ---------- layout ---------- */
  .shell{display:flex;flex:1;min-height:0;}
  .sidebar{
    width:212px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);
    padding:16px 10px;display:flex;flex-direction:column;gap:2px;
  }
  .nav-eyebrow{font-family:var(--mono);font-size:10px;color:var(--text-dim);letter-spacing:0.14em;padding:6px 10px 8px;text-transform:uppercase;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius);
    color:var(--text-muted);font-size:13px;cursor:pointer;border:1px solid transparent;
  }
  .nav-item:hover{background:var(--panel-alt);color:var(--text);}
  .nav-item.active{background:var(--panel-alt);color:var(--amber);border-color:var(--border);}
  .nav-ico{width:16px;text-align:center;font-family:var(--mono);font-size:12px;flex-shrink:0;}
  .nav-item.active .nav-ico{color:var(--amber);}
  .sidebar-foot{margin-top:auto;padding:10px;font-family:var(--mono);font-size:10px;color:var(--text-dim);line-height:1.6;border-top:1px solid var(--border-soft);}

  main{flex:1;min-width:0;overflow-y:auto;padding:22px 26px 60px;}
  .view-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .view-title{font-family:var(--mono);font-size:18px;letter-spacing:0.02em;text-transform:uppercase;}
  .view-sub{color:var(--text-muted);font-size:12.5px;margin-top:3px;}

  /* ---------- generic components ---------- */
  .btn{
    font-family:var(--sans);font-size:12.5px;font-weight:600;border-radius:var(--radius);
    border:1px solid var(--border);background:var(--panel-alt);color:var(--text);
    padding:8px 14px;cursor:pointer;white-space:nowrap;
  }
  .btn:hover{border-color:var(--text-dim);}
  .btn.primary{background:var(--amber);border-color:var(--amber);color:#141414;}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.danger{background:var(--red);border-color:var(--red);color:#fff;}
  .btn.ghost{background:transparent;}
  .btn.sm{padding:5px 9px;font-size:11.5px;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:16px;}
  .grid{display:grid;gap:14px;}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:900px){.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}}

  .metric{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:14px 16px;}
  .metric .k{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.1em;}
  .metric .v{font-family:var(--mono);font-size:24px;margin-top:6px;color:var(--text);}
  .metric .v.amber{color:var(--amber);}
  .metric .v.teal{color:var(--teal);}
  .metric .v.red{color:var(--red);}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{
    text-align:left;font-family:var(--mono);font-size:10px;color:var(--text-dim);text-transform:uppercase;
    letter-spacing:0.08em;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;
  }
  tbody td{padding:9px 10px;border-bottom:1px solid var(--border-soft);color:var(--text);vertical-align:middle;}
  tbody tr:hover{background:var(--panel-alt);}
  .num{font-family:var(--mono);text-align:right;}
  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:6px;background:var(--panel);}

  .badge{font-family:var(--mono);font-size:10px;padding:3px 7px;border-radius:3px;letter-spacing:0.03em;white-space:nowrap;text-transform:uppercase;}
  .badge.teal{background:var(--teal-soft);color:var(--teal);}
  .badge.amber{background:var(--amber-soft);color:var(--amber);}
  .badge.red{background:var(--red-soft);color:var(--red);}
  .badge.gray{background:var(--panel-alt);color:var(--text-muted);border:1px solid var(--border);}

  .alert{
    display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:6px;margin-bottom:12px;
    font-size:12.5px;border:1px solid;
  }
  .alert.warn{background:repeating-linear-gradient(135deg, var(--amber-soft), var(--amber-soft) 10px, rgba(242,183,5,0.05) 10px, rgba(242,183,5,0.05) 20px);border-color:rgba(242,183,5,0.4);color:#F5D57A;}
  .alert.crit{background:repeating-linear-gradient(135deg, var(--red-soft), var(--red-soft) 10px, rgba(228,87,46,0.05) 10px, rgba(228,87,46,0.05) 20px);border-color:rgba(228,87,46,0.45);color:#F3AA93;}
  .alert.info{background:var(--panel-alt);border-color:var(--border);color:var(--text-muted);}
  .alert b{color:inherit;}

  label{display:block;font-family:var(--mono);font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:5px;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
    padding:9px 10px;border-radius:var(--radius);font-size:13px;font-family:var(--sans);
  }
  textarea{resize:vertical;min-height:64px;font-family:var(--sans);}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber);}
  .field{margin-bottom:12px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:600px){.field-row{grid-template-columns:1fr;}}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;}
  .toggle-row .lbl{font-size:12.5px;color:var(--text);}
  .switch{width:38px;height:20px;background:var(--panel-alt);border:1px solid var(--border);border-radius:12px;position:relative;cursor:pointer;flex-shrink:0;}
  .switch.on{background:var(--teal-soft);border-color:var(--teal);}
  .switch .dot{width:14px;height:14px;border-radius:50%;background:var(--text-dim);position:absolute;top:2px;left:2px;transition:left .15s;}
  .switch.on .dot{left:20px;background:var(--teal);}

  .modal-bg{position:fixed;inset:0;background:rgba(6,9,11,0.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:20px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;}
  .modal h3{font-family:var(--mono);font-size:14px;margin:0 0 14px;text-transform:uppercase;letter-spacing:0.03em;color:var(--amber);}
  .modal-close{float:right;background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px;line-height:1;}

  .section-title{font-family:var(--mono);font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.1em;margin:22px 0 10px;display:flex;align-items:center;gap:8px;}
  .section-title::after{content:'';flex:1;height:1px;background:var(--border);}

  .empty{color:var(--text-dim);font-size:12.5px;padding:26px;text-align:center;font-family:var(--mono);}

  .qr-tile{
    width:44px;height:44px;border:1px solid var(--border);border-radius:4px;background:var(--bg);
    display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:8px;color:var(--text-dim);
    flex-shrink:0;position:relative;overflow:hidden;
  }
  .qr-tile::before{content:'';position:absolute;inset:5px;background:
    linear-gradient(90deg, var(--text-dim) 2px, transparent 2px) 0 0/6px 6px,
    linear-gradient(var(--text-dim) 2px, transparent 2px) 0 0/6px 6px;
    opacity:0.5;}

  .signpad-wrap{border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);}
  canvas{display:block;width:100%;touch-action:none;cursor:crosshair;}

  .gauge-wrap{display:flex;flex-direction:column;align-items:center;padding:6px 0;}
  .gauge-val{font-family:var(--mono);font-size:22px;margin-top:-8px;}
  .gauge-lbl{font-family:var(--mono);font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;margin-top:2px;}

  .cert{
    background:#F4F1EA;color:#1a1a1a;border-radius:6px;padding:26px 28px;font-family:var(--sans);
    border:1px solid var(--border);position:relative;
  }
  .cert h4{font-family:var(--mono);font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:#8a6b00;margin:0 0 2px;}
  .cert h2{margin:2px 0 14px;font-size:19px;}
  .cert table{font-size:12px;}
  .cert thead th{color:#8a8578;border-color:#d8d2c2;}
  .cert tbody td{border-color:#e3ded0;color:#1a1a1a;}
  .cert .stamp{
    position:absolute;top:22px;right:26px;border:2px solid;padding:6px 10px;font-family:var(--mono);
    font-size:11px;font-weight:700;letter-spacing:0.06em;transform:rotate(6deg);border-radius:4px;
  }
  .cert .stamp.ok{color:#1c8a6f;border-color:#1c8a6f;}
  .cert .stamp.pnc{color:#c0392b;border-color:#c0392b;}

  .thf-bar{height:8px;border-radius:4px;background:var(--panel-alt);overflow:hidden;margin-top:6px;}
  .thf-bar > div{height:100%;background:linear-gradient(90deg, var(--teal), #58d6c1);}

  @media(max-width:820px){
    .sidebar{position:fixed;left:-220px;top:0;bottom:0;z-index:60;transition:left .18s;box-shadow:4px 0 20px rgba(0,0,0,0.4);}
    .sidebar.open{left:0;}
    .menu-btn{display:flex !important;}
    main{padding:16px;}
  }
  .menu-btn{display:none;background:none;border:1px solid var(--border);color:var(--text);border-radius:4px;padding:6px 9px;cursor:pointer;align-items:center;justify-content:center;}
  .scrim{display:none;}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:50;}
</style>
</head>
<body>
<div id="root">
  <div class="empty" style="padding:60px;">Iniciando LIMS JR-QUALITY…</div>
</div>

<script>
/* =========================================================================
   LIMS JR-QUALITY — Prototipo funcional interactivo
   Módulos: Reactivos/QR (RF-01), Ensayos + THF (RF-02), HSEQ (RF-03),
   Órdenes de Mantenimiento, RBAC simulado, modo Offline-First (RNF-02).
   Persistencia vía window.storage (datos compartidos, ver aviso en UI).
   ========================================================================= */

const ROLES = [
  {id:'ADMIN', label:'Administrador'},
  {id:'ANALISTA', label:'Analista de Laboratorio'},
  {id:'INSPECTOR_HSEQ', label:'Inspector HSEQ'},
  {id:'JEFE_CALIDAD', label:'Jefe de Calidad'},
];

const MODULES = [
  {id:'reactivos', label:'Reactivos & QR', ico:'01', roles:['ADMIN','ANALISTA','JEFE_CALIDAD']},
  {id:'ensayos', label:'Ensayos Analíticos', ico:'02', roles:['ADMIN','ANALISTA','JEFE_CALIDAD']},
  {id:'hseq', label:'Inspección HSEQ', ico:'03', roles:['ADMIN','INSPECTOR_HSEQ','JEFE_CALIDAD']},
  {id:'mantenimiento', label:'Mantenimiento', ico:'04', roles:['ADMIN','INSPECTOR_HSEQ','JEFE_CALIDAD']},
];

let S = {
  role: 'ANALISTA',
  userName: 'usuario.demo',
  view: 'reactivos',
  offline: false,
  queue: [],
  sidebarOpen: false,
  reactivos: [], movimientos: [], muestras: [], ensayos: [], inspecciones: [], ordenes: [],
  loaded: false,
};

const uid = (p) => p + '_' + Math.random().toString(36).slice(2,9);
const todayISO = () => new Date().toISOString();
const fmtDate = (iso) => { try { const d = new Date(iso); return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}); } catch(e){ return iso; } };
const fmtDateTime = (iso) => { try { const d = new Date(iso); return d.toLocaleString('es-CO',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); } catch(e){ return iso; } };
const daysUntil = (iso) => Math.ceil((new Date(iso) - new Date()) / 86400000);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------------- storage helpers ---------------- */
async function loadKey(key, fallback){
  try{
    const r = await window.storage.get(key, true);
    return r ? JSON.parse(r.value) : fallback;
  }catch(e){ return fallback; }
}
async function saveKey(key, val){
  try{ await window.storage.set(key, JSON.stringify(val), true); }
  catch(e){ console.error('storage set failed', key, e); }
}

const SEED_REACTIVOS = [
  {id:'r1', codigo_qr:'QR-THF-001', nombre:'Tetrahidrofurano (THF)', lote:'L-2026-014', stock_actual:8.5, stock_minimo:5, unidad_medida:'L', fecha_vencimiento:'2026-09-05', ubicacion:'Estante A3', es_toxico:true},
  {id:'r2', codigo_qr:'QR-ACE-045', nombre:'Acetona ACS', lote:'L-2026-021', stock_actual:12, stock_minimo:10, unidad_medida:'L', fecha_vencimiento:'2027-03-10', ubicacion:'Estante B1', es_toxico:true},
  {id:'r3', codigo_qr:'QR-NAOH-009', nombre:'Hidróxido de Sodio 1N', lote:'L-2026-030', stock_actual:3.2, stock_minimo:4, unidad_medida:'L', fecha_vencimiento:'2026-12-01', ubicacion:'Estante C2', es_toxico:false},
  {id:'r4', codigo_qr:'QR-ETOH-002', nombre:'Etanol Ecológico (sustituto THF)', lote:'L-2026-055', stock_actual:20, stock_minimo:8, unidad_medida:'L', fecha_vencimiento:'2027-06-20', ubicacion:'Estante A1', es_toxico:false},
  {id:'r5', codigo_qr:'QR-HCL-012', nombre:'Ácido Clorhídrico 0.1N', lote:'L-2025-098', stock_actual:1.4, stock_minimo:3, unidad_medida:'L', fecha_vencimiento:'2026-08-30', ubicacion:'Estante C1', es_toxico:true},
];
const SEED_MUESTRAS = [
  {id:'m1', codigo_lote:'LOTE-JR-2201', descripcion_producto:'Resina PVC Grado Industrial', estado:'APROBADA', fecha_recepcion:'2026-08-18T09:12:00Z', registrado_por:'analista.demo'},
  {id:'m2', codigo_lote:'LOTE-JR-2202', descripcion_producto:'Compuesto Plastificado Flex-9', estado:'REGISTRADA', fecha_recepcion:'2026-08-22T14:05:00Z', registrado_por:'analista.demo'},
];

async function loadAll(){
  S.reactivos = await loadKey('lims:reactivos', SEED_REACTIVOS);
  S.movimientos = await loadKey('lims:movimientos', []);
  S.muestras = await loadKey('lims:muestras', SEED_MUESTRAS);
  S.ensayos = await loadKey('lims:ensayos', []);
  S.inspecciones = await loadKey('lims:inspecciones', []);
  S.ordenes = await loadKey('lims:ordenes', []);
  S.loaded = true;
}

/* ---------------- offline queue simulation ---------------- */
// When offline mode is ON, mutating actions are queued instead of "synced".
// "Sincronizar ahora" flushes the queue into storage — mirrors RNF-02.
function enqueueOrCommit(commitFn, label){
  if(S.offline){
    S.queue.push({id: uid('q'), label, commitFn, ts: todayISO()});
    toast(`Sin conexión: "${label}" guardado localmente, pendiente de sincronizar.`, 'warn');
    render();
  } else {
    commitFn();
  }
}
async function flushQueue(){
  if(S.queue.length === 0) return;
  for(const item of S.queue){ item.commitFn(); }
  const n = S.queue.length;
  S.queue = [];
  toast(`${n} registro(s) sincronizado(s) con el servidor.`, 'ok');
  render();
}

/* ---------------- toast ---------------- */
let toastTimer = null;
function toast(msg, kind){
  const el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;
  el.className = 'toast-box show ' + (kind||'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.className = 'toast-box'; }, 3600);
}

/* ---------------- permissions ---------------- */
function allowedModules(){ return MODULES.filter(m => m.roles.includes(S.role)); }
function canWriteReactivos(){ return ['ADMIN'].includes(S.role); }
function canConsumeReactivos(){ return ['ADMIN','ANALISTA'].includes(S.role); }
function canRunEnsayos(){ return ['ADMIN','ANALISTA'].includes(S.role); }
function canDoHseq(){ return ['ADMIN','INSPECTOR_HSEQ'].includes(S.role); }
function canManageOrdenes(){ return ['ADMIN','INSPECTOR_HSEQ'].includes(S.role); }

/* ========================================================================
   RENDER — SHELL
   ======================================================================== */
function render(){
  const mods = allowedModules();
  if(!mods.find(m=>m.id===S.view)) S.view = mods[0]?.id || 'reactivos';

  document.getElementById('root').innerHTML = `
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="brand">
        <div class="brand-mark">JR</div>
        <div class="brand-text"><b>LIMS · JR-Quality</b><span>Control de Calidad · HSEQ</span></div>
      </div>
      <div class="topbar-spacer"></div>
      <div class="sync-pill" id="syncPill" title="Alternar modo sin conexión">
        <span class="led ${S.offline ? 'off' : ''}"></span>
        ${S.offline ? 'SIN CONEXIÓN' : 'EN LÍNEA'}
        ${S.queue.length ? `<span class="sync-badge">${S.queue.length}</span>` : ''}
      </div>
      <select class="role-select" id="roleSelect">
        ${ROLES.map(r=>`<option value="${r.id}" ${r.id===S.role?'selected':''}>${r.label}</option>`).join('')}
      </select>
    </div>
    <div class="shell">
      <div class="scrim ${S.sidebarOpen?'show':''}" id="scrim"></div>
      <div class="sidebar ${S.sidebarOpen?'open':''}" id="sidebar">
        <div class="nav-eyebrow">Módulos</div>
        ${mods.map(m=>`
          <div class="nav-item ${S.view===m.id?'active':''}" data-view="${m.id}">
            <span class="nav-ico">${m.ico}</span>${m.label}
          </div>`).join('')}
        <div class="sidebar-foot">
          SESIÓN<br>${esc(S.userName)}<br>
          ROL: ${S.role}<br>
          NEON · POSTGRES · GRAPHQL<br>
          TLS 1.3 · AES-256
        </div>
      </div>
      <main id="main"></main>
    </div>
    <div id="toast" class="toast-box"></div>
    <div id="modalRoot"></div>
  `;

  // static toast styles injected once
  if(!document.getElementById('toastStyle')){
    const st = document.createElement('style');
    st.id = 'toastStyle';
    st.textContent = `
      .toast-box{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);
        background:var(--panel-raised);border:1px solid var(--border);color:var(--text);padding:10px 16px;
        border-radius:6px;font-size:12.5px;opacity:0;pointer-events:none;transition:all .18s;z-index:200;
        box-shadow:0 8px 24px rgba(0,0,0,0.4);max-width:90vw;font-family:var(--sans);}
      .toast-box.show{opacity:1;transform:translateX(-50%) translateY(0);}
      .toast-box.warn{border-color:var(--amber);color:var(--amber);}
      .toast-box.crit{border-color:var(--red);color:var(--red);}
      .toast-box.ok{border-color:var(--teal);color:var(--teal);}
    `;
    document.head.appendChild(st);
  }

  document.getElementById('roleSelect').onchange = (e)=>{ S.role = e.target.value; render(); };
  document.getElementById('menuBtn').onclick = ()=>{ S.sidebarOpen = !S.sidebarOpen; render(); };
  document.getElementById('scrim').onclick = ()=>{ S.sidebarOpen = false; render(); };
  document.getElementById('syncPill').onclick = ()=>{
    if(S.offline){ S.offline = false; flushQueue(); } else { S.offline = true; toast('Modo sin conexión activado. Los registros se guardarán localmente.', 'warn'); }
    render();
  };
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.onclick = ()=>{ S.view = el.dataset.view; S.sidebarOpen = false; render(); };
  });

  const main = document.getElementById('main');
  if(S.view === 'reactivos') renderReactivos(main);
  else if(S.view === 'ensayos') renderEnsayos(main);
  else if(S.view === 'hseq') renderHseq(main);
  else if(S.view === 'mantenimiento') renderMantenimiento(main);
}

}

      <div class="view-sub">RF-01 · Escaneo, consumo y Kardex digital de reactivos químicos</div></div>
      <div style="display:flex;gap:8px;">
        ${canConsumeReactivos() ? `<button class="btn primary" id="btnScan">▤ Escanear QR</button>` : ''}

        <span>${vencido ? '⛔' : '⚠'}</span>
        <div><b>${esc(r.nombre)}</b> (${esc(r.codigo_qr)}) —

          low ? `stock ${r.stock_actual} ${r.unidad_medida} por debajo del mínimo (${r.stock_minimo} ${r.unidad_medida}). Solicitud de reabastecimiento enviada a Compras.` :
          `vence en ${daysUntil(r.fecha_vencimiento)} día(s). Solicitud de reabastecimiento enviada a Compras.`}
        </div>
      </div>`;
    }).join('') : ''}

    <div class="grid cols-3" style="margin-bottom:18px;">
      <div class="metric"><div class="k">Reactivos registrados</div><div class="v">${S.reactivos.length}</div></div>
      <div class="metric"><div class="k">Alertas activas</div><div class="v ${alerts.length?'amber':''}">${alerts.length}</div></div>
      <div class="metric"><div class="k">Movimientos en Kardex</div><div class="v teal">${S.movimientos.length}</div></div>
    </div>

    <div class="section-title">Inventario</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>QR</th><th>Reactivo</th><th>Lote</th><th>Stock</th><th>Vence</th><th>Ubicación</th><th></th></tr></thead>
        <tbody>
          ${S.reactivos.map(r => {
            const vencido = daysUntil(r.fecha_vencimiento) < 0;
            const low = r.stock_actual < r.stock_minimo;
            return `<tr>
              <td><div style="display:flex;align-items:center;gap:8px;"><div class="qr-tile"></div><span style="font-family:var(--mono);font-size:11px;color:var(--text-muted);">${esc(r.codigo_qr)}</span></div></td>
              <td>${esc(r.nombre)} ${r.es_toxico ? '<span class="badge red" style="margin-left:6px;">Tóxico</span>' : ''}</td>
              <td class="num">${esc(r.lote)}</td>
              <td class="num" style="color:${low?'var(--red)':'var(--text)'}">${r.stock_actual} / ${r.stock_minimo} ${r.unidad_medida}</td>
              <td class="num" style="color:${vencido?'var(--red)':daysUntil(r.fecha_vencimiento)<=15?'var(--amber)':'var(--text-muted)'}">${fmtDate(r.fecha_vencimiento)}</td>
              <td>${esc(r.ubicacion)}</td>
              <td>${canConsumeReactivos() ? `<button class="btn sm" data-scan="${r.id}">Consumir</button>` : ''}</td>
            </tr>`;
          }).join('')}
        </tbody>

    </div>

    <div class="section-title">Kardex digital</div>

      <table>
        <thead><tr><th>Fecha</th><th>Reactivo</th><th>Tipo</th><th>Cantidad</th><th>Usuario</th><th>Motivo</th></tr></thead>

function openScanModal(preselectId){
  let step = preselectId ? 'detail' : 'scan';
  let selected = preselectId ? S.reactivos.find(r=>r.id===preselectId) : null;

  function draw(){
    if(step === 'scan'){
      openModal(`
        <button class="modal-close" id="mClose">✕</button>
        <h3>▤ Escanear código QR</h3>
        <p style="color:var(--text-muted);font-size:12.5px;margin-top:-6px;">Simulación de lectura de cámara — selecciona el reactivo detectado.</p>
        <div class="field">
          <label>Reactivo detectado</label>
          <select id="qrSelect">
            <option value="">— Seleccionar —</option>
            ${S.reactivos.map(r=>`<option value="${r.id}">${esc(r.codigo_qr)} · ${esc(r.nombre)}</option>`).join('')}
          </select>
        </div>
        <button class="btn primary" id="mNext" style="width:100%;">Confirmar lectura</button>
      `);
      document.getElementById('mClose').onclick = closeModal;
      document.getElementById('mNext').onclick = ()=>{
        const id = document.getElementById('qrSelect').value;
        if(!id){ toast('Selecciona un reactivo para continuar.', 'warn'); return; }
        selected = S.reactivos.find(r=>r.id===id);
        step = 'detail'; draw();
      };
    } else {
      const r = selected;
      const vencido = daysUntil(r.fecha_vencimiento) < 0;
      openModal(`
        <button class="modal-close" id="mClose">✕</button>
        <h3>Consumo de reactivo</h3>
        ${vencido ? `<div class="alert crit"><span>⛔</span><div><b>Reactivo vencido.</b> No se puede registrar consumo. Notifique a Calidad para su disposición.</div></div>` : ''}
        <div class="card" style="margin-bottom:14px;background:var(--panel-alt);">
          <div style="font-size:14px;font-weight:600;">${esc(r.nombre)}</div>
          <div style="color:var(--text-muted);font-size:12px;margin-top:4px;font-family:var(--mono);">
            ${esc(r.codigo_qr)} · Lote ${esc(r.lote)} · Vence ${fmtDate(r.fecha_vencimiento)}
          </div>
          <div style="margin-top:8px;font-family:var(--mono);font-size:13px;">Stock actual: <b>${r.stock_actual} ${r.unidad_medida}</b></div>
        </div>
        <div class="field">
          <label>Analista</label>
          <input type="text" id="fAnalista" value="${esc(S.userName)}" ${vencido?'disabled':''}>
        </div>
        <div class="field">
          <label>Cantidad a consumir (${r.unidad_medida})</label>
          <input type="number" id="fCantidad" min="0" step="0.01" placeholder="0.00" ${vencido?'disabled':''}>
        </div>
        <div class="field">
          <label>Motivo / Ensayo asociado</label>
          <input type="text" id="fMotivo" placeholder="Ej. Análisis de pureza — LOTE-JR-2202" ${vencido?'disabled':''}>
        </div>
        <button class="btn primary" id="mConfirm" style="width:100%;" ${vencido?'disabled':''}>Confirmar consumo</button>
      `);
      document.getElementById('mClose').onclick = closeModal;
      if(!vencido){
        document.getElementById('mConfirm').onclick = ()=>{
          const cantidad = parseFloat(document.getElementById('fCantidad').value);
          const analista = document.getElementById('fAnalista').value.trim() || S.userName;
          const motivo = document.getElementById('fMotivo').value.trim();
          if(!cantidad || cantidad <= 0){ toast('Ingresa una cantidad válida.', 'warn'); return; }
          if(cantidad > r.stock_actual){
            toast(`Stock insuficiente. Disponible: ${r.stock_actual} ${r.unidad_medida}. Se generó solicitud de compra.`, 'crit');
            return;
          }
          enqueueOrCommit(async ()=>{
            r.stock_actual = Math.round((r.stock_actual - cantidad) * 1000) / 1000;
            await saveKey('lims:reactivos', S.reactivos);
            const mov = {id: uid('mov'), reactivo_id: r.id, reactivo_nombre: r.nombre, usuario: analista,
              tipo:'CONSUMO_ENSAYO', cantidad, motivo, fecha_registro: todayISO()};
            S.movimientos.push(mov);
            await saveKey('lims:movimientos', S.movimientos);
            closeModal();
            toast(`Consumo registrado. Nuevo stock: ${r.stock_actual} ${r.unidad_medida}.`, 'ok');
            render();
          }, `Consumo ${r.nombre}`);
          if(S.offline) closeModal();
        };
      }
    }
  }
  draw();
}

  };

          ${S.muestras.length ? S.muestras.map(m => `<tr>
            <td style="font-family:var(--mono);">${esc(m.codigo_lote)}</td>
            <td>${esc(m.descripcion_producto)}</td>
            <td style="color:var(--text-muted);">${fmtDate(m.fecha_recepcion)}</td>

          </tr>`).join('') : `<tr><td colspan="5" class="empty">No hay muestras registradas.</td></tr>`}
        </tbody>
      </table>
    </div>

    <div class="section-title">Ensayos realizados</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Muestra</th><th>Método</th><th>Resultado</th><th>THF (ml)</th><th>Cumple</th><th>Fecha</th><th></th></tr></thead>

              <td style="font-family:var(--mono);">${esc(m?.codigo_lote||'—')}</td>

              <td class="num">${e.volumen_thf_usado_ml || 0}</td>
              <td>${e.cumple_especificacion ? '<span class="badge teal">Sí</span>' : '<span class="badge red">PNC</span>'}</td>

function estadoBadge(estado){
  const map = {REGISTRADA:'gray', EN_PROCESO:'amber', APROBADA:'teal', RECHAZADA_PNC:'red'};
  return `<span class="badge ${map[estado]||'gray'}">${estado.replace('_',' ')}</span>`;
}

function openEnsayoModal(muestraId){
  const muestra = S.muestras.find(m=>m.id===muestraId);
  openModal(`
    <button class="modal-close" id="mClose">✕</button>
    <h3>Registrar ensayo — ${esc(muestra.codigo_lote)}</h3>
    <div class="field"><label>Método analítico</label><input type="text" id="fMetodo" placeholder="Ej. Análisis de pureza"></div>
    <div class="field-row">
      <div class="field"><label>Resultado (valor bruto)</label><input type="number" id="fResultado" step="0.0001" placeholder="0.0000"></div>
      <div class="field"><label>Volumen solvente (ml)</label><input type="number" id="fThf" step="0.1" placeholder="0.0"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Límite inferior aceptado</label><input type="number" id="fMin" step="0.0001" placeholder="0.0000"></div>
      <div class="field"><label>Límite superior aceptado</label><input type="number" id="fMax" step="0.0001" placeholder="0.0000"></div>
    </div>
    <div class="toggle-row"><span class="lbl">Método ecológico (sustituto de THF)</span><div class="switch" id="fEco"><div class="dot"></div></div></div>
    <div class="field"><label>Observaciones</label><textarea id="fObs" placeholder="Notas del analista…"></textarea></div>
    <button class="btn primary" id="mSave" style="width:100%;">Calcular y guardar resultado</button>
  `);
  document.getElementById('mClose').onclick = closeModal;
  let eco = false;
  document.getElementById('fEco').onclick = (e)=>{ eco=!eco; e.currentTarget.classList.toggle('on', eco); };
  document.getElementById('mSave').onclick = ()=>{
    const metodo = document.getElementById('fMetodo').value.trim();
    const resultado = parseFloat(document.getElementById('fResultado').value);
    const thf = parseFloat(document.getElementById('fThf').value) || 0;
    const min = parseFloat(document.getElementById('fMin').value);
    const max = parseFloat(document.getElementById('fMax').value);
    const obs = document.getElementById('fObs').value.trim();
    if(!metodo || isNaN(resultado) || isNaN(min) || isNaN(max)){
      toast('Completa método, resultado y límites de tolerancia.', 'warn'); return;
    }
    const cumple = resultado >= min && resultado <= max;
    const ensayo = {id: uid('e'), muestra_id: muestraId, analista_id: S.userName, nombre_metodo: metodo,
      volumen_thf_usado_ml: thf, es_metodo_ecologico: eco, resultado_parametro: resultado,
      cumple_especificacion: cumple, observaciones: obs, certificado_pdf_url: null, fecha_ensayo: todayISO()};
    enqueueOrCommit(async ()=>{
      S.ensayos.push(ensayo);
      muestra.estado = cumple ? 'APROBADA' : 'RECHAZADA_PNC';
      await saveKey('lims:ensayos', S.ensayos);
      await saveKey('lims:muestras', S.muestras);
      closeModal();
      if(cumple){ toast('Ensayo conforme. Muestra aprobada.', 'ok'); }
      else { toast(`Producto No Conforme (PNC). Notificando a Producción y Jefe de Calidad — ${muestra.codigo_lote}.`, 'crit'); }
      render();
    }, `Ensayo ${muestra.codigo_lote}`);
    if(S.offline) closeModal();
  };
}

          <tr><td style="color:#8a8578;">Lote</td><td><b>${esc(m.codigo_lote)}</b></td></tr>
          <tr><td style="color:#8a8578;">Producto</td><td>${esc(m.descripcion_producto)}</td></tr>

/* ========================================================================
   MODULE: HSEQ (RF-03)
   ======================================================================== */
let signaturePad = null;

function renderHseq(main){
  const inspecciones = [...S.inspecciones].sort((a,b)=> new Date(b.fecha_inspeccion) - new Date(a.fecha_inspeccion));
  const lastGuantes = inspecciones[0]?.stock_guantes_nitrilo ?? '—';

  main.innerHTML = `
    <div class="view-head">
      <div><div class="view-title">Inspección HSEQ</div>
      <div class="view-sub">RF-03 · EPP, cuarto de gases y generación automática de órdenes de mantenimiento</div></div>
    </div>

    <div class="grid cols-2" style="align-items:start;">
      <div class="card">
        <div class="section-title" style="margin-top:0;">Nueva ronda de inspección</div>
        ${canDoHseq() ? `
          <div class="field"><label>Stock de guantes de nitrilo (unidades)</label><input type="number" id="hGuantes" min="0" placeholder="Ej. 120"></div>
          <div class="field">
            <label>Presión del cuarto de gases (PSI)</label>
            <input type="number" id="hPresion" step="0.1" placeholder="Ej. 42.0">
          </div>
          <div id="gaugeHolder"></div>
          <div class="toggle-row"><span class="lbl">Extractor de aire funcional</span><div class="switch on" id="hExtractor"><div class="dot"></div></div></div>
          <div class="toggle-row"><span class="lbl">Cerradura eléctrica en buen estado</span><div class="switch on" id="hCerradura"><div class="dot"></div></div></div>
          <div class="field"><label>Novedades / evidencia observada</label><textarea id="hNovedades" placeholder="Ej. fotografía del panel de control, hallazgos…"></textarea></div>
          <div class="field">
            <label>Firma digital del inspector</label>
            <div class="signpad-wrap"><canvas id="signCanvas" height="120"></canvas></div>
            <button class="btn sm ghost" id="clearSign" style="margin-top:6px;">Limpiar firma</button>
          </div>
          <button class="btn primary" id="btnSubmitHseq" style="width:100%;margin-top:6px;">Enviar inspección</button>
        ` : `<div class="empty">Tu rol (${S.role}) no tiene permiso para registrar inspecciones HSEQ.</div>`}
      </div>

      <div>
        <div class="grid cols-2" style="margin-bottom:14px;">
          <div class="metric"><div class="k">Guantes nitrilo (último conteo)</div><div class="v">${lastGuantes}</div></div>
          <div class="metric"><div class="k">Rondas registradas</div><div class="v teal">${S.inspecciones.length}</div></div>
        </div>
        <div class="section-title" style="margin-top:0;">Historial de rondas</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Fecha</th><th>Inspector</th><th>PSI</th><th>Extractor</th><th>Cerradura</th></tr></thead>
            <tbody>
              ${inspecciones.length ? inspecciones.map(i => `<tr>
                <td style="color:var(--text-muted);">${fmtDateTime(i.fecha_inspeccion)}</td>
                <td>${esc(i.inspector_id)}</td>
                <td class="num">${i.presion_cuarto_gases_psi}</td>
                <td>${i.extractor_funcional ? '<span class="badge teal">OK</span>' : '<span class="badge red">Falla</span>'}</td>
                <td>${i.cerradura_electrica_ok ? '<span class="badge teal">OK</span>' : '<span class="badge red">Falla</span>'}</td>
              </tr>`).join('') : `<tr><td colspan="5" class="empty">Sin rondas registradas.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;

  if(!canDoHseq()) return;

  const gaugeHolder = document.getElementById('gaugeHolder');
  const presionInput = document.getElementById('hPresion');
  const drawGauge = () => { gaugeHolder.innerHTML = gaugeSVG(parseFloat(presionInput.value) || 0); };
  drawGauge();
  presionInput.oninput = drawGauge;

  let extFuncional = true, cerradOk = true;
  document.getElementById('hExtractor').onclick = (e)=>{ extFuncional=!extFuncional; e.currentTarget.classList.toggle('on', extFuncional); };
  document.getElementById('hCerradura').onclick = (e)=>{ cerradOk=!cerradOk; e.currentTarget.classList.toggle('on', cerradOk); };

  // signature pad
  const canvas = document.getElementById('signCanvas');
  const ctx = canvas.getContext('2d');
  function resizeCanvas(){ const r = canvas.getBoundingClientRect(); canvas.width = r.width; canvas.height = 120; ctx.strokeStyle = '#E7EDEF'; ctx.lineWidth = 2; ctx.lineCap='round'; }
  resizeCanvas();
  let drawing = false, hasSig = false;
  function pos(e){ const r = canvas.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; return {x: t.clientX-r.left, y: t.clientY-r.top}; }
  function start(e){ drawing=true; hasSig=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); }
  function end(){ drawing=false; }
  canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start); canvas.addEventListener('touchmove', move); canvas.addEventListener('touchend', end);
  document.getElementById('clearSign').onclick = ()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); hasSig=false; };

  document.getElementById('btnSubmitHseq').onclick = ()=>{
    const guantes = parseInt(document.getElementById('hGuantes').value);
    const presion = parseFloat(document.getElementById('hPresion').value);
    const novedades = document.getElementById('hNovedades').value.trim();
    if(isNaN(guantes) || isNaN(presion)){ toast('Completa stock de guantes y presión del cuarto de gases.', 'warn'); return; }
    if(!hasSig){ toast('Se requiere la firma digital del inspector.', 'warn'); return; }
    const firma = canvas.toDataURL('image/png');
    const inspeccion = {id: uid('i'), inspector_id: S.userName, stock_guantes_nitrilo: guantes,
      presion_cuarto_gases_psi: presion, extractor_funcional: extFuncional, cerradura_electrica_ok: cerradOk,
      evidencia_foto_url: null, firma_url: firma, novedades, fecha_inspeccion: todayISO()};

    const psiAbnormal = presion < 20 || presion > 60;
    const fallaCritica = !extFuncional || !cerradOk;

    enqueueOrCommit(async ()=>{
      S.inspecciones.push(inspeccion);
      await saveKey('lims:inspecciones', S.inspecciones);

      if(fallaCritica || psiAbnormal){
        const partes = [];
        if(!extFuncional) partes.push('falla en el extractor de aire');
        if(!cerradOk) partes.push('falla en la cerradura eléctrica');
        if(psiAbnormal) partes.push(`lectura de presión anormal (${presion} PSI)`);
        const orden = {id: uid('om'), inspeccion_id: inspeccion.id,
          descripcion_fallo: 'Hallazgo en cuarto de gases: ' + partes.join(', ') + '.',
          prioridad: fallaCritica ? 'CRITICA' : 'ALTA', estado: 'PENDIENTE', fecha_generacion: todayISO()};
        S.ordenes.push(orden);
        await saveKey('lims:ordenes', S.ordenes);
      }
      toast(fallaCritica || psiAbnormal ? 'Inspección guardada. Orden de trabajo generada para Mantenimiento.' : 'Inspección guardada sin novedades críticas.', fallaCritica||psiAbnormal ? 'crit' : 'ok');
      render();
    }, 'Inspección HSEQ');
  };
}

function gaugeSVG(val){
  const min=0, max=80;
  const clamped = Math.max(min, Math.min(max, val));
  const pct = (clamped-min)/(max-min);
  const angle = 180 * pct; // 0..180 deg across semicircle
  const cx=90, cy=85, r=70;
  const toXY = (deg) => { const rad = (180-deg) * Math.PI/180; return [cx + r*Math.cos(rad), cy - r*Math.sin(rad)]; };
  const [nx, ny] = toXY(angle);
  const color = (val < 20 || val > 60) ? 'var(--red)' : (val < 30 || val > 50) ? 'var(--amber)' : 'var(--teal)';
  return `
  <div class="gauge-wrap">
    <svg width="180" height="100" viewBox="0 0 180 100">
      <path d="M 20 85 A 70 70 0 0 1 160 85" fill="none" stroke="#2A3841" stroke-width="10" stroke-linecap="round"/>
      <path d="M 20 85 A 70 70 0 0 1 160 85" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="${angle/180*219.9} 219.9"/>
      <line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="${color}" stroke-width="2.5"/>
      <circle cx="${cx}" cy="${cy}" r="4" fill="${color}"/>
    </svg>
    <div class="gauge-val" style="color:${color};">${val || 0}</div>
    <div class="gauge-lbl">PSI · zona segura 20–60</div>
  </div>`;
}

/* ========================================================================
   MODULE: ÓRDENES DE MANTENIMIENTO
   ======================================================================== */
function renderMantenimiento(main){
  const ordenes = [...S.ordenes].sort((a,b)=> new Date(b.fecha_generacion) - new Date(a.fecha_generacion));
  const pendientes = S.ordenes.filter(o=>o.estado==='PENDIENTE').length;
  const criticas = S.ordenes.filter(o=>o.prioridad==='CRITICA' && o.estado!=='RESUELTA').length;

  main.innerHTML = `
    <div class="view-head">
      <div><div class="view-title">Órdenes de Mantenimiento</div>
      <div class="view-sub">Generadas automáticamente por hallazgos de inspección HSEQ</div></div>
    </div>
    <div class="grid cols-3" style="margin-bottom:18px;">
      <div class="metric"><div class="k">Órdenes totales</div><div class="v">${S.ordenes.length}</div></div>
      <div class="metric"><div class="k">Pendientes</div><div class="v amber">${pendientes}</div></div>
      <div class="metric"><div class="k">Críticas abiertas</div><div class="v ${criticas?'red':''}">${criticas}</div></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Fecha</th><th>Descripción</th><th>Prioridad</th><th>Estado</th><th></th></tr></thead>
        <tbody>
          ${ordenes.length ? ordenes.map(o => `<tr>
            <td style="color:var(--text-muted);">${fmtDateTime(o.fecha_generacion)}</td>
            <td>${esc(o.descripcion_fallo)}</td>
            <td><span class="badge ${o.prioridad==='CRITICA'?'red':o.prioridad==='ALTA'?'amber':'gray'}">${o.prioridad}</span></td>
            <td>${o.estado==='RESUELTA'?'<span class="badge teal">RESUELTA</span>':o.estado==='EN_PROCESO'?'<span class="badge amber">EN PROCESO</span>':'<span class="badge gray">PENDIENTE</span>'}</td>
            <td>${canManageOrdenes() && o.estado!=='RESUELTA' ? `<select data-orden="${o.id}" class="role-select" style="font-size:11px;">
                <option value="PENDIENTE" ${o.estado==='PENDIENTE'?'selected':''}>Pendiente</option>
                <option value="EN_PROCESO" ${o.estado==='EN_PROCESO'?'selected':''}>En proceso</option>
                <option value="RESUELTA" ${o.estado==='RESUELTA'?'selected':''}>Resuelta</option>
              </select>` : ''}</td>
          </tr>`).join('') : `<tr><td colspan="5" class="empty">No hay órdenes de mantenimiento generadas.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
  document.querySelectorAll('[data-orden]').forEach(sel => {
    sel.onchange = () => {
      const orden = S.ordenes.find(o=>o.id===sel.dataset.orden);
      orden.estado = sel.value;
      enqueueOrCommit(async ()=>{ await saveKey('lims:ordenes', S.ordenes); toast('Estado de la orden actualizado.', 'ok'); render(); }, 'Actualizar orden');
    };
  });
}
